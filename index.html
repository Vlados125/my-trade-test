<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swing AI Analyzer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #94a3b8; }
        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #loading { display: none; text-align: center; margin: 15px 0; color: #38bdf8; }
        #result { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; font-family: monospace; font-size: 14px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Свінг Аналізатор (AI + Binance)</h2>
        
        <div class="form-group">
            <label for="assetSelect">Оберіть актив:</label>
            <select id="assetSelect">
                <option value="BTC">Bitcoin (BTC)</option>
                <option value="ETH">Ethereum (ETH)</option>
                <option value="SOL">Solana (SOL)</option>
                <option value="BNB">Binance Coin (BNB)</option>
                <option value="XRP">Ripple (XRP)</option>
                <option value="ADA">Cardano (ADA)</option>
                <option value="AVAX">Avalanche (AVAX)</option>
                <option value="LINK">Chainlink (LINK)</option>
                <option value="DOT">Polkadot (DOT)</option>
                <option value="NEAR">Near Protocol (NEAR)</option>
            </select>
        </div>

        <div class="form-group">
            <label>1. Старший ТФ (1W/1D):</label>
            <input type="file" id="file1" accept="image/*">
        </div>

        <div class="form-group">
            <label>2. Середній ТФ (1D/4H):</label>
            <input type="file" id="file2" accept="image/*">
        </div>

        <div class="form-group">
            <label>3. Робочий ТФ (4H):</label>
            <input type="file" id="file3" accept="image/*">
        </div>

        <button id="analyzeBtn" onclick="startAnalysis()">Проаналізувати</button>

        <div id="loading">Збираємо дані з Binance та аналізуємо графіки... Зачекайте хвилину ⏳</div>

        <div id="result" style="display: none;"></div>
    </div>

    <script>
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    // Вирізаємо префікс data:image/...;base64,
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function startAnalysis() {
            const asset = document.getElementById('assetSelect').value;
            const f1 = document.getElementById('file1').files[0];
            const f2 = document.getElementById('file2').files[0];
            const f3 = document.getElementById('file3').files[0];

            if (!f1 || !f2 || !f3) {
                alert("Будь ласка, завантажте всі 3 скріншоти!");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            try {
                const [b64_1, b64_2, b64_3] = await Promise.all([
                    fileToBase64(f1),
                    fileToBase64(f2),
                    fileToBase64(f3)
                ]);

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        asset: asset,
                        images: [b64_1, b64_2, b64_3]
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Помилка сервера");
                }

                // Форматуємо JSON для красивого відображення
                let parsedJson;
                try {
                    parsedJson = JSON.parse(data.result);
                    resultDiv.textContent = JSON.stringify(parsedJson, null, 2);
                } catch (e) {
                    resultDiv.textContent = data.result;
                }
                resultDiv.style.display = 'block';

            } catch (err) {
                alert("Помилка: " + err.message);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
